services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: aquaponics-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  influxdb:
    image: influxdb:1.8-alpine
    container_name: aquaponics-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=aquaponics

  telegraf:
    image: telegraf:alpine
    container_name: aquaponics-telegraf
    restart: unless-stopped
    depends_on:
      - mosquitto
      - influxdb
    volumes:
      - ./deploy/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  grafana:
    image: grafana/grafana:latest
    container_name: aquaponics-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - influxdb
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro

  mock-publisher:
    image: python:3.12-alpine
    container_name: aquaponics-mock-publisher
    profiles:
      - mock
    depends_on:
      - mosquitto
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
    command: >
      sh -c "pip install --no-cache-dir paho-mqtt && python /app/scripts/mock_publisher.py --broker mosquitto --interval 3"
